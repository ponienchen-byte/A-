                            <span class="px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-800 font-bold">晚餐</span>
                            <span class="text-slate-700 font-medium">${item.dinner}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 即時篩選每日行程
        function filterItinerary(keyword) {
            const tour = TOURS_DATA.find(t => t.id === currentTab);
            if (!tour) return;

            const q = keyword.trim().toLowerCase();
            const container = document.getElementById('itineraryTimelineContainer');

            if (!q) {
                container.innerHTML = renderItineraryCards(tour.itinerary);
                return;
            }

            const filtered = tour.itinerary.filter(item => {
                return (
                    item.day.toLowerCase().includes(q) ||
                    item.date.toLowerCase().includes(q) ||
                    item.route.toLowerCase().includes(q) ||
                    item.spots.toLowerCase().includes(q) ||
                    item.breakfast.toLowerCase().includes(q) ||
                    item.lunch.toLowerCase().includes(q) ||
                    item.dinner.toLowerCase().includes(q) ||
                    item.hotel.toLowerCase().includes(q)
                );
            });

            container.innerHTML = renderItineraryCards(filtered);
        }
    </script>
</body>
</html>
